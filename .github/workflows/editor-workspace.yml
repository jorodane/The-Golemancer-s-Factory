name: Editor workspace verification
on:
  push:
    branches: [main, 'codex/ui-workspace-*']
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Editor packs and main workspace
        run: python tools/verify-editor-packs.py
      - name: Worker identities and shared review
        run: python tools/verify-studio.py
      - name: Scoped editor authoring
        run: python tools/verify-authoring.py
      - name: Independent game and full campaign
        run: python Golemancer/tools/verify-isolation.py
      - name: Report verification status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'Confectory / portable',
              description: 'Workspace, modules, worker isolation and full campaign',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Native Windows editor build
        shell: cmd
        run: BuildEditor.bat
      - name: Report verification status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'Confectory / Windows', description: 'Native net48 editor and external packs build',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install android
      - name: Android SDK dependencies
        run: dotnet build editor/PackEngine.Editor.Android/PackEngine.Editor.Android.csproj -t:InstallAndroidDependencies -p:AcceptAndroidSdkLicenses=true -p:EngineTargetFramework=net10.0
      - name: Native Android editor build
        run: dotnet build editor/PackEngine.Editor.Android/PackEngine.Editor.Android.csproj -c Release -p:EngineTargetFramework=net10.0 -p:UseSharedCompilation=false -m:1 --nologo -v:minimal
      - name: Report verification status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'Confectory / Android', description: 'Native Android editor and external packs build',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
