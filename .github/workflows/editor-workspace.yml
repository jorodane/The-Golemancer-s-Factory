name: Editor workspace verification
on:
  push:
    branches: [main, 'codex/ui-workspace-*']
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
defaults:
  run:
    working-directory: ConfectoryEngine
env:
  CONFECTORY_TEST_PROJECT: ${{ github.workspace }}/ConfectoryProjects/Golemancer/Golemancer.packproject
  CONFECTORY_ENGINE_ROOT: ${{ github.workspace }}/ConfectoryEngine
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Independent engine without a consumer
        run: python tools/verify-engine.py
      - name: Editor packs and main workspace
        run: python tools/verify-editor-packs.py --project "$CONFECTORY_TEST_PROJECT"
      - name: Worker identities and shared review
        run: python tools/verify-studio.py
      - name: Scoped editor authoring
        run: python tools/verify-authoring.py
      - name: Independent game and full campaign
        run: python tools/verify-project-layout.py --project "$CONFECTORY_TEST_PROJECT"
      - name: Report verification status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'Confectory / portable',
              description: 'Workspace, modules, worker isolation and full campaign',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Android Play build configuration
        shell: powershell
        run: ./tools/TestAndroidPlayBuild.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Native Windows editor build
        shell: cmd
        run: BuildEditor.bat
      - name: Installed Windows pack engine
        run: python tools/verify-editor-engine.py --directory editor/Builds/Windows/Engine --receipt engine-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: engine-windows-receipt
          path: ConfectoryEngine/engine-windows.json
      - name: Native workspace and worker interaction
        shell: pwsh
        run: |
          dotnet build tests/Confectory.Editor.Native.Verification/Confectory.Editor.Native.Verification.csproj -c Release -p:EngineTargetFramework=net48 -p:UseSharedCompilation=false -m:1 --nologo -v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item tests/Confectory.Editor.Native.Verification/bin/Release/net48/Confectory.Editor.Native.Verification.exe* editor/Builds/Windows/
          & editor/Builds/Windows/Confectory.Editor.Native.Verification.exe "$env:GITHUB_WORKSPACE/ConfectoryEngine"
          exit $LASTEXITCODE
      - name: Native project home screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-project-home
          path: ConfectoryEngine/TestResults/native/project-home.png
      - name: Report verification status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'Confectory / Windows', description: 'Native net48 editor and external packs build',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install android
      - name: Android SDK dependencies
        run: dotnet build editor/Confectory.Editor.Android/Confectory.Editor.Android.csproj -t:InstallAndroidDependencies -p:AcceptAndroidSdkLicenses=true -p:EngineTargetFramework=net10.0
      - name: Native Android editor build
        run: dotnet build editor/Confectory.Editor.Android/Confectory.Editor.Android.csproj -c Release -p:EngineTargetFramework=net10.0 -p:UseSharedCompilation=false -m:1 --nologo -v:minimal
      - name: Packaged Android pack engine
        run: python tools/verify-editor-engine.py --apk-directory editor/Confectory.Editor.Android/bin/Release/net10.0-android --receipt engine-android.json
      - uses: actions/upload-artifact@v4
        with:
          name: engine-android-receipt
          path: ConfectoryEngine/engine-android.json
      - name: Report verification status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'Confectory / Android', description: 'Native Android editor and external packs build',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
  engine-compatibility:
    defaults:
      run:
        working-directory: .
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: engine-*-receipt
          merge-multiple: true
      - name: Windows and Android share the engine declarations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          windows = json.loads(Path('engine-windows.json').read_text())
          android = json.loads(Path('engine-android.json').read_text())
          assert windows['framework'] == 'net48' and android['framework'] == 'net10.0'
          assert windows['id'] == android['id'] and windows['compatibility'] == android['compatibility']
          print('ENGINE_CROSS_PLATFORM_COMPATIBILITY=PASS')
          PY
